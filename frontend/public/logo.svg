<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1c0c"/><stop offset="1" stop-color="#140d05"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6b45a"/><stop offset="0.55" stop-color="#e38a2e"/>
      <stop offset="1" stop-color="#c96d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#e38a2e" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#e38a2e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pageClip">
      <path d="M176 104 H300 L356 160 V404 C356 418 345 428 332 428 H176 C163 428 152 418 152 404 V128 C152 115 163 104 176 104 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- the brief: a page, with lines of text clipped to its silhouette -->
  <g clip-path="url(#pageClip)" stroke="url(#mark)" stroke-width="18" stroke-linecap="round" opacity="0.92">
    <line x1="190" y1="212" x2="318" y2="212"/>
    <line x1="190" y1="258" x2="318" y2="258"/>
    <line x1="190" y1="304" x2="286" y2="304"/>
  </g>
  <path d="M176 104 H300 L356 160 V404 C356 418 345 428 332 428 H176 C163 428 152 418 152 404 V128 C152 115 163 104 176 104 Z"
        fill="none" stroke="url(#mark)" stroke-width="24" stroke-linejoin="round"/>
  <!-- the verdict: a bold check settling the page -->
  <path d="M300 338 L330 368 L384 300" fill="none" stroke="url(#mark)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
